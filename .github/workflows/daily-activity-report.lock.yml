name: Daily Activity Report

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Gather recent activity and create issue
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sinceDate = new Date(Date.now() - 24*60*60*1000);
            const since = sinceDate.toISOString();

            // Parallelize API calls to reduce total execution time
            const [commits, pulls, issuesResp] = await Promise.all([
              github.rest.repos.listCommits({owner, repo, since, per_page: 100}),
              github.rest.pulls.list({owner, repo, state: 'closed', per_page: 100}),
              github.rest.issues.listForRepo({owner, repo, since, state: 'all', per_page: 100})
            ]);

            // Pre-calculated sinceDate is used for comparison to avoid redundant Date object creation in filter loop
            const mergedPRs = pulls.data.filter(p => p.merged_at && new Date(p.merged_at) >= sinceDate);

            // Issues (exclude PRs)
            const issues = issuesResp.data.filter(i => !i.pull_request);

            const date = new Date().toISOString().slice(0,10);
            const title = `Daily activity report — ${date}`;

            function listToMd(items, formatter) {
              if (items.length === 0) return '*No items*\n';
              return items.map(formatter).join('\n');
            }

            const commitsMd = listToMd(commits.data, c => `- ${c.commit.message.split('\n')[0]} ([view](${c.html_url}))`);
            const prsMd = listToMd(mergedPRs, p => `- ${p.title} [#${p.number}](${p.html_url}) — @${p.user.login}`);
            const issuesMd = listToMd(issues, i => `- ${i.title} [#${i.number}](${i.html_url}) — @${i.user.login}`);

            const body = `### Commits\n\n${commitsMd}\n<details><summary>Show more</summary>\n\n### Merged PRs\n\n${prsMd}\n\n### New Issues\n\n${issuesMd}\n</details>`;

            // Create the issue
            await github.rest.issues.create({owner, repo, title, body});
